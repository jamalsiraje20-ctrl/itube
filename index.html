<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>iTube</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e11d48">
<link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f3f3f5;--acc:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--fg:#f2f2f2;--mut:#9a9aa3;--card:#1c1c22}}
:root[data-theme="dark"]{--bg:#0f0f12;--fg:#f2f2f2;--mut:#9a9aa3;--card:#1c1c22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:10px;align-items:center;padding:10px 14px;z-index:5;border-bottom:1px solid var(--card)}
.logo{font-weight:800;font-size:22px;direction:ltr;white-space:nowrap}
.logo span{background:var(--acc);color:#fff;border-radius:6px;padding:0 6px;margin-inline-start:2px}
form{flex:1;display:flex;gap:6px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--card);background:var(--card);color:var(--fg);font-size:15px}
button{border:0;border-radius:999px;background:var(--acc);color:#fff;padding:10px 16px;font-size:15px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px}
#player{display:none;margin-bottom:16px}
.frame{position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ptitle{margin:10px 0 0;font-size:17px}
#msg{color:var(--mut);font-size:13px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer}
.th{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.card div.t{padding:10px 12px;font-size:14px}
.card small{display:block;color:var(--mut);margin-top:4px}
h2{font-size:16px;margin:8px 0 12px}
</style>
</head>
<body>
<header>
  <div class="logo">i<span>Tube</span></div>
  <form id="f"><input id="q" placeholder="الصق رابط فيديو يوتيوب هنا…" autocomplete="off"><button>تشغيل</button></form>
</header>
<main>
  <section id="player">
    <div class="frame"><iframe id="ifr" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="iTube player"></iframe></div>
    <h3 id="ptitle"></h3>
    <p><a id="yt" target="_blank" rel="noopener" style="color:var(--acc);font-weight:600">فتح الفيديو في يوتيوب ◀</a></p>
  </section>
  <div id="msg"></div>
  <h2>مقترح لك</h2>
  <div class="grid" id="g"></div>
</main>
<script>
var vids=[
 {id:"jNQXAC9IVRw",t:"Me at the zoo — أول فيديو على يوتيوب",c:"#0ea5e9,#1e3a8a"},
 {id:"dQw4w9WgXcQ",t:"Rick Astley — Never Gonna Give You Up",c:"#f43f5e,#7f1d1d"},
 {id:"9bZkp7q19f0",t:"PSY — Gangnam Style",c:"#a855f7,#4c1d95"},
 {id:"kJQP7kiw5Fk",t:"Luis Fonsi — Despacito",c:"#f59e0b,#78350f"}
];
var g=document.getElementById("g");
vids.forEach(function(v){
  var d=document.createElement("div");d.className="card";
  d.innerHTML='<div class="th" style="background:linear-gradient(135deg,'+v.c+')">▶</div><div class="t">'+v.t+'<small>iTube</small></div>';
  d.onclick=function(){play(v.id,v.t)};g.appendChild(d);
});
function parse(s){
  s=s.trim();
  if(/^[\w-]{11}$/.test(s))return s;
  var m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function play(id,t){
  document.getElementById("player").style.display="block";
  document.getElementById("ifr").src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0";
  document.getElementById("yt").href="https://www.youtube.com/watch?v="+id;
  document.getElementById("ptitle").textContent=t||"فيديو من يوتيوب";
  document.getElementById("msg").textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var id=parse(document.getElementById("q").value);
  if(id)play(id);
  else document.getElementById("msg").textContent="الرابط غير صالح، الصق رابط فيديو يوتيوب كاملاً.";
};
</script>
</body>
</html>
